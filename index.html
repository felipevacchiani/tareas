<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<title>Pendientes</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #aviso { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: #8e8e93; transition: opacity .3s; }
  #aviso a { color: #f5f5f7; }
  #aviso.oculto { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbw3YfdmyyxjYrzHwtpaSNt2zI1PmZ5c9BPI7tpH9Cz2rU7_HXEAbdjvoNrHOFbzEtpkNw/exec"
          allow="clipboard-write" title="Pendientes"></iframe>
  <div id="aviso">¿No carga? <a href="https://script.google.com/macros/s/AKfycbw3YfdmyyxjYrzHwtpaSNt2zI1PmZ5c9BPI7tpH9Cz2rU7_HXEAbdjvoNrHOFbzEtpkNw/exec" target="_top">Abrir directo</a></div>
  <script>
    // Safari (y todo navegador de iPhone/iPad) bloquea la sesión de Google dentro de otra página y da 401:
    // ahí se abre la app directo, con el cartel de Google
    var ua = navigator.userAgent;
    var esApple = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var esSafari = /Safari/.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua);
    if (esApple || esSafari) location.replace(document.getElementById('app').src);
    // El aviso queda unos segundos por si el navegador bloquea el inicio de sesión de Google dentro de la página
    setTimeout(function () { document.getElementById('aviso').classList.add('oculto'); }, 8000);
  </script>
</body>
</html>
